<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Путь к $100 000</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#16181d;--hint:#8a8f98;--line:rgba(127,127,140,.18);
  --accent:#2f6fde;--accent-t:#fff;--good:#1f9d55;--bad:#d4482f;--warn:#d98a00;
  --needs:#e3f2da;--needs-s:#c3e2b4;--wants:#e1e8f8;--wants-s:#bccbee;--inv:#fdf3cf;--inv-s:#f7e19a;
  --c1:#2f6fde;--c2:#9bbcf3;
  --top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --bottom:var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1013;--card:#1b1d22;--text:#f1f2f4;--hint:#8f949c;--line:rgba(255,255,255,.08);
  --accent:#5b9bff;--good:#3cc47c;--bad:#ff6b52;--warn:#f0b03a;
  --needs:#1f2e21;--needs-s:#2a4129;--wants:#1d2538;--wants-s:#2a3653;--inv:#332d1b;--inv-s:#4b4226;--c1:#5b9bff;--c2:#2e4c80}}
:root[data-theme="dark"]{
  --bg:#0f1013;--card:#1b1d22;--text:#f1f2f4;--hint:#8f949c;--line:rgba(255,255,255,.08);
  --accent:#5b9bff;--good:#3cc47c;--bad:#ff6b52;--warn:#f0b03a;
  --needs:#1f2e21;--needs-s:#2a4129;--wants:#1d2538;--wants-s:#2a3653;--inv:#332d1b;--inv-s:#4b4226;--c1:#5b9bff;--c2:#2e4c80}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--text)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--top) + 10px) 16px 8px}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--hint);font-size:13px}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(84px + var(--bottom))}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--hint);font-weight:600}
.big{font-size:28px;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--hint);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:13px;color:var(--hint);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:17px;outline:none}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:14px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--bg);border-radius:10px;padding:7px 11px;font-size:14px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-t)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:700;background:var(--accent);color:var(--accent-t);text-align:center;text-decoration:none;margin-top:8px}
.btn.sec{background:var(--bg);color:var(--text)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--bottom))}
nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--hint);padding:4px 0}
nav button b{font-size:21px;line-height:1;font-weight:400}
nav button.on{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--hint);font-weight:600;font-size:12px}
svg text{fill:var(--hint);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--hint);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cat{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border-bottom:0}
.cat .ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.cat .mid{flex:1;min-width:0}
.cat .nm{font-weight:600}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--good);border-radius:4px}
.bar i.over{background:var(--bad)}.bar i.near{background:var(--warn)}
.st{font-weight:700;font-size:14px;white-space:nowrap;text-align:right}
.plus{color:var(--good)}.minus{color:var(--bad)}
.tip{padding:10px 12px;background:var(--bg);border-radius:12px;margin-bottom:8px;font-size:14px}
.tip b{display:block;margin-bottom:2px}
.list .it{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.list .it:last-child{border-bottom:0}
.x{border:0;background:transparent;color:var(--hint);padding:0 0 0 10px;font-size:16px}
.fab{position:fixed;right:16px;bottom:calc(76px + var(--bottom));z-index:6;border:0;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(47,111,222,.35)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + var(--bottom));max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .2s}
.sheet{visibility:hidden}.sheet.open{transform:none;visibility:visible}.sheet-bg.open{display:block}
.sheet h3{margin:0 0 12px;font-size:18px;padding-right:36px}
.sx{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:var(--bg);color:var(--hint);font-size:15px}
.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:0;margin-bottom:8px}
/* бюджет */
.group{border-radius:14px;overflow:hidden;margin-bottom:10px}
.ghead{display:flex;justify-content:space-between;padding:9px 12px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.ghead span:last-child{text-transform:none;letter-spacing:0}
.g-needs{background:var(--needs)}.g-needs .ghead{background:var(--needs-s)}
.g-wants{background:var(--wants)}.g-wants .ghead{background:var(--wants-s)}
.g-inv{background:var(--inv)}.g-inv .ghead{background:var(--inv-s)}
.brow{display:grid;grid-template-columns:24px 1fr 58px minmax(80px,auto);gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:15px}
.brow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{display:flex;align-items:center;justify-content:flex-end;background:rgba(255,255,255,.5);border-radius:8px;padding:3px 6px}
:root[data-theme="dark"] .pct{background:rgba(0,0,0,.25)}
.pct input{width:30px;border:0;background:transparent;text-align:right;font-size:15px;outline:none;padding:0}
.amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hidden{display:none!important}
</style>
</head>
<body>
<header><h1 id="title">Главная</h1><p id="subtitle"></p></header>
<main id="view"></main>
<button class="fab hidden" id="fab" aria-label="Добавить трату">+</button>
<nav id="nav"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<script>
// Код приложения грузится отдельным файлом с меткой времени, чтобы Telegram не показывал старую версию из кэша.
(function () {
  var s = document.createElement("script");
  s.src = "app.js?t=" + Date.now();
  s.onerror = function () { document.getElementById("view").innerHTML = '<div class="card"><b>Не удалось загрузить приложение</b><div class="muted">Проверь интернет и открой ещё раз.</div></div>'; };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
